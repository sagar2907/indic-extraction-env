[project]
name = "indic-extraction-v1"
version = "0.1.3"
description = "Structured extraction from Indic-script documents with a deterministic, script-aware verifier."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# `tags`, not `keywords`. This is a Prime Intellect extension to the PEP 621 table
# rather than a standard field, and the Hub's integration test asserts on it directly
# -- a push whose pyproject carries only `keywords` is accepted, then fails CI with
# "pyproject.toml does not have tags". Standard build backends tolerate the extra key,
# so there is no reason to carry both and two places for the list to drift.
tags = [
  "indic",
  "hindi",
  "marathi",
  "tamil",
  "bengali",
  "multilingual",
  "structured-extraction",
  "single-turn",
  "reward-hacking",
  "eval",
  "train",
]

# Deliberately empty. The corpus is generated from a seed rather than downloaded,
# and every normalizer is stdlib-only, so this environment installs and runs
# offline with no transitive dependency surface. `verifiers` is supplied by the
# host that loads the taskset and must not be pinned here.
dependencies = []

[project.optional-dependencies]
# Research tooling: rollout runner, adversarial policies, report rendering.
# Not part of the published wheel — see [tool.hatch.build.targets.wheel] below.
dev = [
  "verifiers>=0.2.1",
  "openai>=2.9.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indic_extraction_v1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Literal Devanagari/Tamil/Bengali text is the subject matter of this package;
  # RUF001-003 flag the ambiguous Unicode that is precisely what we are testing.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.verifiers.eval]
# Defaults for `prime env eval`. Twenty examples at three rollouts each is enough to
# separate the models this environment was validated against (exact match 0.92 vs 0.62)
# without spending a consumer's quota on a first look.
num_examples = 20
rollouts_per_example = 3
